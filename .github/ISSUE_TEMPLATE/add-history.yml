name: Add history or facts
description: Suggest historical details or facts about a fort
title: '[History] '
labels: [history]
body:
  - type: input
    id: fort
    attributes:
      label: Fort
      description: Name, and the ID if you know it. The ID is the number at the end of the fort's page address (e.g. Raigad, 188).
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What should be added?
      description: Who built it or when, key events, people associated with it, architecture.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Books, gazetteers, inscriptions, links. Required.
    validations:
      required: true
